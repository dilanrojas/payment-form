<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./app.js" defer></script>
  <title>Formulario de pago</title>
</head>

<body class="min-h-full font-sans antialiased text-gray-900 flex items-center justify-center p-4">

  <main class="w-full max-w-lg">
    <!-- Form Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

      <!-- Header -->
      <div class="px-6 py-5 border-b border-gray-200 bg-gray-50/75">
        <h1 class="text-xl font-bold tracking-tight text-gray-900">Formulario de pago</h1>
        <p class="mt-1 text-sm text-gray-500">Ingresa tus datos para completar la transacción.</p>
      </div>

      <!-- Form -->
      <form id="paymentForm" method="post" class="p-6 space-y-8">

        <!-- Información de contacto -->
        <fieldset>
          <legend class="text-base font-semibold text-gray-900 mb-4">Información de contacto</legend>
          <div class="space-y-4">

            <div>
              <!-- Nota: Corregí el 'fro' por 'for' en las etiquetas label -->
              <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre <span
                  class="text-red-500">*</span></label>
              <input type="text" id="name" name="name" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" />
            </div>

            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email <span
                  class="text-red-500">*</span></label>
              <input type="email" id="email" name="email" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" />
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña <span
                  class="text-red-500">*</span></label>
              <input type="password" id="password" name="password" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" />
            </div>

          </div>
        </fieldset>

        <hr class="border-gray-200" />

        <!-- Información de pago -->
        <fieldset>
          <legend class="text-base font-semibold text-gray-900 mb-4">Información de pago</legend>
          <div class="space-y-4">

            <div>
              <label for="card-type" class="block text-sm font-medium text-gray-700 mb-1">Tipo de tarjeta</label>
              <select id="card-type" name="card-type"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors appearance-none">
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="amex">American Express</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="sm:col-span-1">
                <label for="card-number" class="block text-sm font-medium text-gray-700 mb-1">Número de tarjeta <span
                    class="text-red-500">*</span></label>
                <input type="number" name="card-number" id="card-number" required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors [&::-webkit-inner-spin-button]:appearance-none" />
              </div>

              <div class="sm:col-span-1">
                <label for="card-expiry" class="block text-sm font-medium text-gray-700 mb-1">Vencimiento <span
                    class="text-red-500">*</span></label>
                <input type="text" name="card-expiry" id="card-expiry" placeholder="MM/AA" required
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors placeholder:text-gray-400" />
              </div>
            </div>

          </div>
        </fieldset>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            Validar pago
          </button>
        </div>

      </form>
    </div>

    <!-- Navigation Footer Link -->
    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition-colors">
        &larr; Volver a la lista de clientes
      </a>
    </div>

  </main>

</body>

</html>
